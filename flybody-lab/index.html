<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Flybody Digital Specimen</title>
<style>
*{box-sizing:border-box}body{margin:0;background:radial-gradient(ellipse at 45% 45%,#102d48,#050b15 65%,#02050a);color:#e9f8ff;font:14px system-ui;overflow:hidden}#view{position:fixed;inset:0}canvas{display:block}header{position:fixed;left:24px;top:20px;z-index:2;pointer-events:none}h1{font-size:17px;letter-spacing:3px;margin:0 0 5px}small{color:#8cb6ce;letter-spacing:1px}.panel{position:fixed;right:16px;top:16px;bottom:16px;width:260px;padding:17px;background:#071726df;border:1px solid #4bdcff44;border-radius:14px;backdrop-filter:blur(14px);overflow:auto;z-index:3}.panel h2{font-size:16px;margin:6px 0 16px}.panel h3{font-size:11px;color:#86c6df;margin:15px 0 9px;border-top:1px solid #4bdcff30;padding-top:13px}button{background:#102c43;color:#eafaff;border:1px solid #37627a;border-radius:7px;padding:8px;cursor:pointer;font-size:12px}button.active,button:hover{border-color:#65eaff;background:#12435a}.grid{display:grid;grid-template-columns:1fr 1fr;gap:7px}label{display:block;color:#b5d2df;font-size:11px;margin:9px 0 5px}input{width:100%;accent-color:#5ce7ff}.note{font-size:10px;color:#7fa5b8;line-height:1.5}#status{font-size:11px;color:#87eaff;line-height:1.5;min-height:35px}#tip{position:fixed;bottom:18px;left:24px;color:#83aabc;font-size:11px}@media(max-width:650px){.panel{width:215px;right:7px;top:7px;bottom:7px;padding:12px}header{left:12px;top:10px}h1{font-size:12px}}
</style></head><body><div id="view"></div><header><h1>TRANSLUCENT FRUIT FLY</h1><small>FLYBODY · DIGITAL SPECIMEN</small></header><aside class="panel"><small>SCIENTIFIC 3D VISUALIZATION</small><h2>透明果蝇实验室</h2>
<h3>观察模式</h3><div class="grid"><button data-mode="all" class="active">完整标本</button><button data-mode="wings">翅膀</button><button data-mode="head">头部</button><button data-mode="body">身体</button></div>
<h3>结构显示</h3><div class="grid"><button data-part="head" class="active">头部</button><button data-part="thorax" class="active">胸部</button><button data-part="abdomen" class="active">腹部</button><button data-part="wings" class="active">翅膀</button><button data-part="legs" class="active">六足</button><button data-part="antenna" class="active">触角</button></div>
<h3>材质控制</h3><label>透明度 <span id="opv">42%</span></label><input id="opacity" type="range" min="10" max="95" value="42"><label>荧光强度 <span id="glv">65%</span></label><input id="glow" type="range" min="0" max="100" value="65">
<h3>动画</h3><div class="grid"><button id="spin">自动旋转</button><button id="flap" class="active">翅膀振动</button><button id="explode" style="grid-column:span 2">拆解观察</button></div>
<h3>模型状态</h3><div id="status">正在读取官方 Flybody XML 与 OBJ 网格…</div><p class="note">基于 TuragaLab/flybody 官方外部几何网格。翅膀振动与拆解为视觉演示，不代表 MuJoCo 实时策略仿真；外部模型不包含完整脑、神经及内部肌肉数据。</p></aside><div id="tip">拖动旋转 · 滚轮缩放 · 右键平移</div>
<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"}}</script>
<script type="module">
import * as THREE from 'three';import {OrbitControls} from 'three/addons/controls/OrbitControls.js';import {OBJLoader} from 'three/addons/loaders/OBJLoader.js';
const ASSET='https://raw.githubusercontent.com/TuragaLab/flybody/main/flybody/fruitfly/assets/';
const scene=new THREE.Scene();scene.fog=new THREE.FogExp2(0x06111f,.035);const camera=new THREE.PerspectiveCamera(36,innerWidth/innerHeight,.01,100);camera.position.set(2.8,1.3,4.1);
const renderer=new THREE.WebGLRenderer({antialias:true,alpha:true});renderer.setPixelRatio(Math.min(devicePixelRatio,2));renderer.setSize(innerWidth,innerHeight);renderer.toneMapping=THREE.ACESFilmicToneMapping;renderer.toneMappingExposure=1.35;document.querySelector('#view').appendChild(renderer.domElement);
const controls=new OrbitControls(camera,renderer.domElement);controls.enableDamping=true;controls.target.set(0,0,0);scene.add(new THREE.HemisphereLight(0x9cecff,0x10172b,2));
for(const [c,i,p] of [[0x36cfff,85,[2,3,3]],[0x176bff,55,[-3,1,-2]],[0xff6c9c,28,[0,-2,2]]]){const l=new THREE.PointLight(c,i,30);l.position.set(...p);scene.add(l)}
const fly=new THREE.Group();scene.add(fly);const loader=new OBJLoader(),items=[],mats=[];let spin=false,flap=true,explode=false,loaded=false;
const vec=(s,d='0 0 0')=>new THREE.Vector3(...(s||d).trim().split(/\s+/).map(Number));const quat=s=>new THREE.Quaternion(...(s||'1 0 0 0').trim().split(/\s+/).map(Number).filter((_,i)=>i!==0).concat([]));
function qparse(s){let a=(s||'1 0 0 0').trim().split(/\s+/).map(Number);return new THREE.Quaternion(a[1]||0,a[2]||0,a[3]||0,a[0]??1)}
function cat(n){n=n.toLowerCase();if(/wing/.test(n))return'wings';if(/antenna/.test(n))return'antenna';if(/head|eye|ocelli|labrum|proboscis/.test(n))return'head';if(/thorax|haltere/.test(n))return'thorax';if(/abdomen/.test(n))return'abdomen';if(/coxa|femur|tibia|tarsus|claw|leg/.test(n))return'legs';return'other'}
async function main(){const response=await fetch(ASSET+'fruitfly.xml');if(!response.ok)throw Error('官方 XML 读取失败：'+response.status);const xml=new DOMParser().parseFromString(await response.text(),'text/xml');const meshMap={};xml.querySelectorAll('asset mesh').forEach(e=>meshMap[e.getAttribute('name')]=e);
const defaults=xml.querySelector('default mesh');const defScale=vec(defaults?.getAttribute('scale'),'0.1 0.1 0.1');const jobs=[];
function walk(body,parent){const node=new THREE.Group();node.position.copy(vec(body.getAttribute('pos')));node.quaternion.copy(qparse(body.getAttribute('quat')));parent.add(node);
for(const el of body.children){if(el.tagName==='body')walk(el,node);if(el.tagName==='geom'&&el.hasAttribute('mesh')){const asset=meshMap[el.getAttribute('mesh')];if(!asset)continue;const file=asset.getAttribute('file');if(!file)continue;const gp=new THREE.Group();gp.position.copy(vec(el.getAttribute('pos')));gp.quaternion.copy(qparse(el.getAttribute('quat')));node.add(gp);const kind=cat((body.getAttribute('name')||'')+' '+(el.getAttribute('name')||'')+' '+file);const sc=vec(asset.getAttribute('scale'),defScale.toArray().join(' '));jobs.push(loader.loadAsync(ASSET+file).then(obj=>{obj.scale.copy(sc);obj.traverse(x=>{if(x.isMesh){const mat=new THREE.MeshPhysicalMaterial({color:kind==='wings'?0x8edfff:kind==='head'?0xa4bfff:0x62caff,metalness:.15,roughness:.2,transparent:true,opacity:.42,side:THREE.DoubleSide,depthWrite:false,emissive:0x06466d,emissiveIntensity:.65,clearcoat:1});x.material=mat;mats.push(mat)}});gp.add(obj);items.push({obj,kind,base:obj.position.clone(),rot:obj.rotation.clone(),file,body:body.getAttribute('name')||''})}))}}
const wb=xml.querySelector('worldbody');for(const b of wb.children)if(b.tagName==='body')walk(b,fly);await Promise.all(jobs);
const box=new THREE.Box3().setFromObject(fly),size=box.getSize(new THREE.Vector3()),center=box.getCenter(new THREE.Vector3());fly.position.sub(center);fly.scale.setScalar(2.2/Math.max(size.x,size.y,size.z));document.querySelector('#status').textContent='已装配 '+items.length+' 个 OBJ 网格；来自官方模型 XML。';loaded=true}
main().catch(e=>document.querySelector('#status').textContent='加载失败：'+e.message+'。请稍后重试或检查网络。');
document.querySelectorAll('[data-part]').forEach(b=>b.onclick=()=>{b.classList.toggle('active');items.filter(x=>x.kind===b.dataset.part).forEach(x=>x.obj.visible=b.classList.contains('active'))});
document.querySelectorAll('[data-mode]').forEach(b=>b.onclick=()=>{document.querySelectorAll('[data-mode]').forEach(x=>x.classList.remove('active'));b.classList.add('active');items.forEach(x=>x.obj.visible=b.dataset.mode==='all'||(b.dataset.mode==='wings'&&x.kind==='wings')||(b.dataset.mode==='head'&&x.kind==='head')||(b.dataset.mode==='body'&&!['wings','antenna'].includes(x.kind)))});
opacity.oninput=e=>{const v=e.target.value/100;opv.textContent=e.target.value+'%';mats.forEach(m=>m.opacity=v)};glow.oninput=e=>{const v=e.target.value/100;glv.textContent=e.target.value+'%';mats.forEach(m=>m.emissiveIntensity=v*1.5)};
document.querySelector('#spin').onclick=e=>{spin=!spin;e.target.classList.toggle('active',spin)};document.querySelector('#flap').onclick=e=>{flap=!flap;e.target.classList.toggle('active',flap)};document.querySelector('#explode').onclick=e=>{explode=!explode;e.target.classList.toggle('active',explode)};
const clock=new THREE.Clock();function animate(){requestAnimationFrame(animate);const t=clock.getElapsedTime();if(spin)fly.rotation.y+=.002;if(flap)items.filter(x=>x.kind==='wings').forEach((x,i)=>{const side=/left/i.test(x.file+' '+x.body)?-1:1;x.obj.rotation.z=x.rot.z+side*.25*Math.sin(t*70+i*.08);x.obj.rotation.x=x.rot.x+side*.08*Math.cos(t*70+i*.08)});items.forEach(x=>{const v=explode?1:0,k=x.kind;const off=new THREE.Vector3(k==='head'?v*.22:k==='abdomen'?v*-.28:k==='wings'?v*.38:k==='legs'?v*.16:0,k==='wings'?v*.18:0,0);x.obj.position.lerp(x.base.clone().add(off),.06)});controls.update();renderer.render(scene,camera)}animate();addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight)});
</script></body></html>
